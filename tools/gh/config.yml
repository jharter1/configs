# gh CLI config, linked to ~/.config/gh/config.yml (hosts.yml with tokens stays local).
version: "1"
git_protocol: ssh
editor:
prompt: enabled
# delta formats `gh pr diff`; other output passes through untouched
pager: delta
browser:
http_unix_socket:
aliases:
    co: pr checkout
    prs: pr status
    mine: pr list --author "@me"
    review: pr list --search "review-requested:@me"
    checks: pr checks --watch
