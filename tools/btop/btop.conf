# btop: quiet, ANSI colours so it follows Ghostty's Tokyo Night light/dark.
# Only overrides are listed; btop fills in defaults for everything else.
# save_config_on_exit is off so btop never rewrites this (symlinked) file.

save_config_on_exit = False

color_theme = "TTY"
theme_background = False
rounded_corners = True
graph_symbol = "braille"

# CPU, memory and processes; skip net/disk boxes
shown_boxes = "cpu mem proc"
update_ms = 2000
proc_sorting = "cpu lazy"
proc_gradient = False
mem_graphs = False

vim_keys = True
