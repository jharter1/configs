# Terraform + Kubernetes work. Run from the Terraform root.
# Nothing runs against the cloud on open; plan/apply are yours to type.
name: infra
root: <%= ENV["PWD"] %>
startup_window: editor
windows:
  - editor:
      layout: main-vertical
      panes:
        - nvim
        -
  - terraform:
      panes:
        -
  - k8s:
      panes:
        - k9s
  - monitor:
      panes:
        - btop
