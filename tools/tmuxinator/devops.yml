# Containers and clusters around the current project.
name: devops
root: <%= ENV["PWD"] %>
startup_window: editor
windows:
  - editor:
      layout: main-horizontal
      panes:
        - nvim
        -
  - docker:
      layout: even-vertical
      panes:
        - watch -n 2 -t "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
        -
  - k8s:
      panes:
        - k9s
  - git:
      panes:
        - gitui
