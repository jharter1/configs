# ~/.config/starship.toml

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Language/tool context on the right — only renders in relevant project directories
right_format = "$docker_context$ruby$python$nodejs$golang$rust$package$kubernetes$aws$azure"

scan_timeout = 30
command_timeout = 500

format = """
[╭─ ](bold cyan)$username$hostname$sudo$jobs$shlvl$memory_usage${custom.vpn} ${fill} ${custom.uptime}$battery${custom.daytime}$time[ ─╮](bold cyan)
[├─ ](bold cyan)$directory $git_branch${custom.git_age}$git_state$git_status$git_metrics$git_commit
[╰─❯ ](bold cyan)$status$cmd_duration$character"""

# ── Line 1: Identity ──────────────────────────────────────────────────────────

# Sudo cached (security awareness)
[sudo]
disabled = false
symbol = "\uF023 "
format = "[$symbol]($style)"
style = "bold red"

# Background jobs
[jobs]
disabled = false
symbol = "✦"
number_threshold = 1
format = " [$symbol$number]($style)"
style = "bold blue"

# Shell nesting level (tmux awareness)
[shlvl]
disabled = false
threshold = 2
symbol = "\uF149 "
format = " [$symbol$shlvl]($style)"
style = "bold yellow"

# Only appears under memory pressure
[memory_usage]
disabled = false
threshold = 75
symbol = "\U000F035B "             # 󰍛
format = " [$symbol$ram_pct]($style)"
style = "bold dimmed red"

# Only appears while a VPN (Tailscale, NordVPN, …) is connected
[custom.vpn]
when = true
shell = ["sh"]
command = """
name=$(scutil --nc list | sed -n 's/^\\* (Connected)[^"]*"\\([^ "]*\\).*/\\1/p' | head -1)
[ -n "$name" ] && echo "\U000F0582 $name" """    # 󰖂
style = "bold green"
format = "( [$output]($style))"

[username]
disabled = false
format = "[$user](bold purple)"
show_always = true
aliases = { "jackharter" = "\uF1BF jwh" }

[hostname]
disabled = false
ssh_only = false
style = "bold cyan"
format = "[@$hostname]($style)"

# ── Line 2: Directory + Git ───────────────────────────────────────────────────

[directory]
truncation_symbol = "…/"
truncation_length = 3
home_symbol = "~"
style = "bold blue"
format = "[\uEA83 $path]($style)[$read_only]($read_only_style)"
read_only = " \uF023"
read_only_style = "bold red"

[git_branch]
symbol = "\uE725 "
style = "bold purple"
format = 'on [$symbol$branch]($style) '
truncation_length = 28
truncation_symbol = "…"

# Time since last commit (5m, 3h, 2d, 6w), next to the branch
[custom.git_age]
require_repo = true
when = true
shell = ["sh"]
command = """
ct=$(git log -1 --format=%ct 2>/dev/null) || exit 0
d=$(( $(date +%s) - ct ))
if   [ $d -lt 3600 ];   then echo "$((d / 60))m"
elif [ $d -lt 86400 ];  then echo "$((d / 3600))h"
elif [ $d -lt 604800 ]; then echo "$((d / 86400))d"
else                         echo "$((d / 604800))w"
fi"""
symbol = "\U000F02DA "             # 󰋚
style = "dimmed white"
format = "[$symbol$output]($style) "

# Shows MERGING / REBASING / CHERRY-PICKING etc.
[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold red"

[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
staged = '[✓ \($count\)](green)'
untracked = '[? \($count\)](blue)'
modified = '[! \($count\)](yellow)'
conflicted = '[× \($count\)](red)'
ahead = '[⇡\($count\)](cyan)'
behind = '[⇣\($count\)](cyan)'
diverged = '[⇕\($ahead_count\)⇡\($behind_count\)](red)'
up_to_date = '[✓](green)'
stashed = '[⚑\($count\)](magenta)'
renamed = '[» \($count\)](yellow)'
deleted = '[✘\($count\)](red)'

[git_commit]
commit_hash_length = 7
tag_symbol = "\uF02B "
disabled = false
only_detached = true

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = "[+$added]($added_style)/[-$deleted]($deleted_style)"

# ── Line 3: Input ─────────────────────────────────────────────────────────────

[cmd_duration]
min_time = 500
style = "dimmed yellow"
show_milliseconds = true
format = "[took $duration]($style) "

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
not_executable_symbol = "\uF05E "
not_found_symbol = "\uF002 "
sigint_symbol = "✋ "
signal_symbol = "\uF0E7 "
style = "bold red"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"

# ── Right: Language / tool context ────────────────────────────────────────────

[ruby]
disabled = false
symbol = "\uE791 "
format = "[$symbol$version]($style) "
style = "bold red"

[python]
disabled = false
symbol = "\uE73C "
format = "[$symbol$version]($style)[ ($virtualenv)](dimmed cyan) "
style = "bold yellow"

[nodejs]
disabled = false
symbol = "\uE718 "
format = "[$symbol$version]($style) "
style = "bold green"
detect_files = ["package.json", ".node-version", "node_modules"]
detect_folders = ["node_modules"]

[golang]
disabled = false
symbol = "\uE626 "
format = "[$symbol$version]($style) "
style = "bold cyan"

[rust]
disabled = false
symbol = "\uE7A8 "
format = "[$symbol$version]($style) "
style = "bold red"

[package]
disabled = false
symbol = "\uF187 "
format = "[$symbol$version]($style) "
style = "dimmed cyan"

[docker_context]
symbol = "\uF308 "
format = "[$symbol$context]($style) "
style = "bold blue"
disabled = false
only_with_files = true

[aws]
disabled = false
symbol = "\uF0C2 "
format = '[$symbol$profile(\($region\))( \[$duration\])]($style) '
style = "bold yellow"

[kubernetes]
symbol = "\uE81D "
format = '[$symbol$context](dimmed cyan) '
disabled = false

# ── Right: Utilities ──────────────────────────────────────────────────────────

# Always shown; icon fills/drains with charge level, colour shifts as it drops
[battery]
disabled = false
full_symbol = "\U000F0079 "          # 󰁹
charging_symbol = "\U000F0084 "      # 󰂄
discharging_symbol = "\U000F007E "   # 󰁾
unknown_symbol = "\U000F06A5 "       # 󰚥 plugged in, holding charge
empty_symbol = "\U000F008E "         # 󰂎
format = "[$symbol$percentage]($style) "
display = [
    { threshold = 10, style = "bold red", discharging_symbol = "\U000F008E " },
    { threshold = 20, style = "bold red", discharging_symbol = "\U000F007A " },
    { threshold = 40, style = "bold yellow", discharging_symbol = "\U000F007C " },
    { threshold = 60, style = "yellow", discharging_symbol = "\U000F007E " },
    { threshold = 80, style = "green", discharging_symbol = "\U000F0080 " },
    { threshold = 100, style = "bold green", discharging_symbol = "\U000F0082 " },
]

# Clock icon follows the day: sunrise, sun, sunset, moon
[custom.daytime]
when = true
shell = ["sh"]
command = """
h=$(date +%H)
if   [ $h -ge 5 ]  && [ $h -lt 9 ];  then echo "\U000F059C"
elif [ $h -ge 9 ]  && [ $h -lt 17 ]; then echo "\U000F0599"
elif [ $h -ge 17 ] && [ $h -lt 21 ]; then echo "\U000F059B"
else                                     echo "\U000F0594"
fi"""
style = "bold yellow"
format = "[$output ]($style)"

# Nudge to reboot: only appears after a week of uptime
[custom.uptime]
when = true
shell = ["sh"]
command = """
boot=$(sysctl -n kern.boottime | sed 's/^{ sec = \\([0-9]*\\).*/\\1/')
d=$(( ($(date +%s) - boot) / 86400 ))
[ $d -ge 7 ] && echo "\U000F0425 up ${d}d" """    # 󰐥
style = "dimmed yellow"
format = "([$output]($style) )"

[time]
disabled = false
use_12hr = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "bold green"

# Draws the rule across the top line, joining the ╭─ frame to the ─╮ corner
[fill]
symbol = "─"
style = "cyan"

[terraform]
disabled = true

[azure]
disabled = false
format = '[$symbol$subscription]($style) '
style = "bold #0078D4"

[gcloud]
disabled = true
