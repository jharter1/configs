# ~/.config/starship.toml

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Quiet by default: structure and steady-state info are muted, colour is
# reserved for things that need attention (dirty git, errors, low battery…)
palette = "quiet"

# Language/tool context on the right — only renders in relevant project directories
right_format = "$docker_context$ruby$python$nodejs$golang$rust$package$kubernetes$aws$azure"

scan_timeout = 30
command_timeout = 500

format = """
[╭─ ](frame)$username$hostname$sudo$jobs$shlvl$memory_usage${custom.vpn} ${fill} ${custom.uptime}$battery${custom.daytime}$time
[├─ ](frame)$directory $git_branch${custom.git_age}$git_state$git_status$git_metrics$git_commit
[╰─ ](frame)$status$cmd_duration$character"""

# ── Line 1: Identity ──────────────────────────────────────────────────────────

# Sudo cached (security awareness)
[sudo]
disabled = false
symbol = "\uF023 "
format = " [$symbol]($style)"
style = "red"

# Background jobs
[jobs]
disabled = false
symbol = "✦"
number_threshold = 1
format = " [$symbol$number]($style)"
style = "cyan"

# Shell nesting level (tmux awareness)
[shlvl]
disabled = false
threshold = 3                       # 2 is normal inside tmux
symbol = "\uF149 "
format = " [$symbol$shlvl]($style)"
style = "muted"

# Only appears under memory pressure
[memory_usage]
disabled = false
threshold = 75
symbol = "\U000F035B "             # 󰍛
format = " [$symbol$ram_pct]($style)"
style = "red"

# Only appears while a VPN (Tailscale, NordVPN, …) is connected
[custom.vpn]
when = true
shell = ["sh"]
command = """
name=$(scutil --nc list | sed -n 's/^\\* (Connected)[^"]*"\\([^ "]*\\).*/\\1/p' | head -1)
[ -n "$name" ] && echo "\U000F0582 $name" """    # 󰖂
style = "green"
format = "( [$output]($style))"

[username]
disabled = false
format = "[$user](muted)"
show_always = true
aliases = { "jackharter" = "\uF1BF jwh" }

[hostname]
disabled = false
ssh_only = false
style = "muted"
format = "[@$hostname]($style)"

# ── Line 2: Directory + Git ───────────────────────────────────────────────────

[directory]
truncation_symbol = "…/"
truncation_length = 4
home_symbol = "~"
style = "purple"
format = "[\uEA83 $path]($style)[$read_only]($read_only_style)"
# Inside a git repo, start the path at the repo root and highlight its name
repo_root_style = "bold purple"
repo_root_format = "[\uEA62 ]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"
read_only = " \uF023"
read_only_style = "red"

[git_branch]
symbol = "\uE725 "
style = "cyan"
format = '[on](muted) [$symbol$branch]($style) '
truncation_length = 28
truncation_symbol = "…"

# Time since last commit (5m, 3h, 2d, 6w), next to the branch
[custom.git_age]
require_repo = true
when = true
shell = ["sh"]
command = """
ct=$(git log -1 --format=%ct 2>/dev/null) || exit 0
d=$(( $(date +%s) - ct ))
if   [ $d -lt 3600 ];   then echo "$((d / 60))m"
elif [ $d -lt 86400 ];  then echo "$((d / 3600))h"
elif [ $d -lt 604800 ]; then echo "$((d / 86400))d"
else                         echo "$((d / 604800))w"
fi"""
symbol = "\U000F02DA "             # 󰋚
style = "muted"
format = "[$symbol$output]($style) "

# Shows MERGING / REBASING / CHERRY-PICKING etc.
[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "red"

# Compact, and silent when clean: [+2 !3 ?1 ⇡1]
[git_status]
style = "muted"
format = '([\[](muted)$all_status$ahead_behind[\]](muted) )'
staged = '[+$count](green)'
untracked = '[?$count](muted)'
modified = '[!$count](yellow)'
conflicted = '[×$count](red)'
ahead = '[⇡$count](cyan)'
behind = '[⇣$count](cyan)'
diverged = '[⇕$ahead_count/$behind_count](red)'
up_to_date = ""
stashed = '[⚑$count](muted)'
renamed = '[»$count](yellow)'
deleted = '[✘$count](red)'

[git_commit]
commit_hash_length = 7
tag_symbol = "\uF02B "
disabled = false
only_detached = true

[git_metrics]
disabled = false
added_style = "green"
deleted_style = "red"
format = "[+$added]($added_style)[/](muted)[-$deleted]($deleted_style)"

# ── Line 3: Input ─────────────────────────────────────────────────────────────

[cmd_duration]
min_time = 500
style = "muted"
show_milliseconds = true
format = "[took $duration]($style) "

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
not_executable_symbol = "\uF05E "
not_found_symbol = "\uF002 "
sigint_symbol = "✋ "
signal_symbol = "\uF0E7 "
style = "red"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](yellow)"

# ── Right: Language / tool context ────────────────────────────────────────────

[ruby]
disabled = false
symbol = "\uE791 "
format = "[$symbol$version]($style) "
style = "muted"

[python]
disabled = false
symbol = "\uE73C "
format = "[$symbol$version]($style)[ ($virtualenv)](muted) "
style = "muted"

[nodejs]
disabled = false
symbol = "\uE718 "
format = "[$symbol$version]($style) "
style = "muted"
detect_files = ["package.json", ".node-version", "node_modules"]
detect_folders = ["node_modules"]

[golang]
disabled = false
symbol = "\uE626 "
format = "[$symbol$version]($style) "
style = "muted"

[rust]
disabled = false
symbol = "\uE7A8 "
format = "[$symbol$version]($style) "
style = "muted"

[package]
disabled = false
symbol = "\uF187 "
format = "[$symbol$version]($style) "
style = "muted"

[docker_context]
symbol = "\uF308 "
format = "[$symbol$context]($style) "
style = "muted"
disabled = false
only_with_files = true

# Only when a profile is active (AWS_PROFILE etc.); a bare default region isn't worth showing
[aws]
disabled = false
format = "([\uF0C2 $profile( \\[$duration\\])]($style) )"
style = "muted"

# Only in folders that look like Kubernetes work; production contexts turn red
[kubernetes]
symbol = "\uE81D "
format = '[$symbol$context]($style) '
style = "muted"
disabled = false
detect_files = ["Chart.yaml", "kustomization.yaml", "helmfile.yaml", "skaffold.yaml", "Tiltfile"]
detect_folders = ["k8s", "manifests", "charts", "helm", "kustomize"]
contexts = [
    { context_pattern = ".*(prod|production|prd).*", style = "bold red" },
]

# ── Right: Utilities ──────────────────────────────────────────────────────────

# Always shown; muted while healthy, coloured only once it's getting low
[battery]
disabled = false
full_symbol = "\U000F0079 "          # 󰁹
charging_symbol = "\U000F0084 "      # 󰂄
discharging_symbol = "\U000F007E "   # 󰁾
unknown_symbol = "\U000F06A5 "       # 󰚥 plugged in, holding charge
empty_symbol = "\U000F008E "         # 󰂎
format = "[$symbol$percentage]($style) "
display = [
    { threshold = 10, style = "bold red", discharging_symbol = "\U000F008E " },
    { threshold = 20, style = "red", discharging_symbol = "\U000F007A " },
    { threshold = 40, style = "yellow", discharging_symbol = "\U000F007C " },
    { threshold = 60, style = "muted", discharging_symbol = "\U000F007E " },
    { threshold = 80, style = "muted", discharging_symbol = "\U000F0080 " },
    { threshold = 100, style = "muted", discharging_symbol = "\U000F0082 " },
]

# Clock icon follows the day: sunrise, sun, sunset, moon
[custom.daytime]
when = true
shell = ["sh"]
command = """
h=$(date +%H)
if   [ $h -ge 5 ]  && [ $h -lt 9 ];  then echo "\U000F059C"
elif [ $h -ge 9 ]  && [ $h -lt 17 ]; then echo "\U000F0599"
elif [ $h -ge 17 ] && [ $h -lt 21 ]; then echo "\U000F059B"
else                                     echo "\U000F0594"
fi"""
style = "muted"
format = "[$output ]($style)"

# Nudge to reboot: only appears after a week of uptime
[custom.uptime]
when = true
shell = ["sh"]
command = """
boot=$(sysctl -n kern.boottime | sed 's/^{ sec = \\([0-9]*\\).*/\\1/')
d=$(( ($(date +%s) - boot) / 86400 ))
[ $d -ge 7 ] && echo "\U000F0425 up ${d}d" """    # 󰐥
style = "yellow"
format = "([$output]($style) )"

[time]
disabled = false
use_12hr = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "muted"

# Faint dashed rule across the top line
[fill]
symbol = "┈"
style = "frame"

[terraform]
disabled = true

[azure]
disabled = true
format = '[$symbol$subscription]($style) '
style = "muted"

[gcloud]
disabled = true

# ── Palette ───────────────────────────────────────────────────────────────────

# ANSI slots rather than hex, so the prompt follows Ghostty's light/dark theme.
# Other colours (purple, cyan, green, yellow, red) are used by name directly.
[palettes.quiet]
frame = "bright-black"   # faintest: frame and top rule
muted = "white"          # steady-state info (ANSI 7 is a soft grey-blue in Tokyo Night)
